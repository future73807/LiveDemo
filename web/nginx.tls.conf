# 自签名 HTTPS 模式（WEB_NGINX_CONF=./web/nginx.tls.conf 时启用）
# 证书挂载在 /etc/nginx/certs（fullchain.pem + privkey.pem，见 scripts/gen-dev-cert.sh）
# 80 端口保留给生产模式的 HTTP 反代；本文件只做 443，访问时直接用 https://host:映射端口

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://live-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WHEP/WHIP 信令同源反代（base 模式播放/推流地址为相对 /rtc/...）
    location /rtc/ {
        proxy_pass http://srs:1985;
        proxy_set_header Host $host;
    }

    # HTTP-FLV / HLS 反代（base 模式播放地址为同源 /live/...）
    location /live/ {
        proxy_pass http://srs:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # 浏览器原生 WebSocket 走同源 /ws
    location /ws {
        proxy_pass http://live-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # index.html 不缓存：发版后浏览器必须拉新清单，避免旧包缓存导致"新功能不可用"
        add_header Cache-Control "no-cache" always;
    }
}
