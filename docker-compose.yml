services:
  srs:
    image: ossrs/srs:5
    container_name: livedemo-srs
    restart: unless-stopped
    ports:
      - "1935:1935"       # RTMP 推流
      - "1985:1985"       # HTTP API + WebRTC 信令(WHEP)
      - "8080:8080"       # HTTP-FLV / HLS
      - "8000:8000/udp"   # WebRTC 媒体
    environment:
      - CANDIDATE=127.0.0.1   # 本机演示用；公网部署改为服务器公网 IP
    volumes:
      # 镜像默认以 conf/docker.conf 启动（见容器 Cmd），故覆盖该文件而非 srs.conf
      - ./srs/srs.conf:/usr/local/srs/conf/docker.conf

  live-service:
    build: ./live-service
    container_name: livedemo-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=demo
      - LIVE_JWT_SECRET=${LIVE_JWT_SECRET:-ZGVtb19kZW1vX2RlbW9fZGVtb19kZW1vX2RlbW8xMjM0NQ==}
    volumes:
      - livedemo-data:/app/data

  web:
    build: ./web
    container_name: livedemo-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - live-service

volumes:
  livedemo-data:
