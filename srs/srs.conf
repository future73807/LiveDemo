listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    # Docker 部署必须指定候选地址，compose 中通过环境变量注入
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    # RTMP 推流自动转 WebRTC 可播（设计 §4.2）
    rtc {
        enabled     on;
        rtmp_to_rtc on;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      6;
    }
}
