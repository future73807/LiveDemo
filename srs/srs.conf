listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    # Docker 部署必须指定候选地址，compose 中通过环境变量注入
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    # HTTP 回调：驱动 live-service 房间状态机（SRS5 要求 http_hooks 配置在 vhost 内）
    http_hooks {
        enabled         on;
        on_publish      http://live-service:8081/api/v1/srs/hooks;
        on_unpublish    http://live-service:8081/api/v1/srs/hooks;
    }
    # RTMP 推流自动转 WebRTC 可播（设计 §4.2）
    rtc {
        enabled     on;
        rtmp_to_rtc on;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      6;
    }
}
